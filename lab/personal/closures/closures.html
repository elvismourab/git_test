<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closures</title>
</head>

<body>
    <script>
        function outer() {
            const outerVar = "Hey I am the outer var";

            return function inner() {
                const innerVar = "Hey I am an inner var";
                console.log(innerVar);
                console.log(outerVar);
            };
        }

        const innerFn = outer();
        innerFn();
        console.log('----------');


        function createGreeting(greeting = "") {
            const myGreet = greeting.toUpperCase();

            return function (name) {
                return `${myGreet} ${name}`;
            };
        }

        const sayHello = createGreeting('hello');
        const sayHey = createGreeting('hey');
        console.log(sayHello('wes'));
        console.log(sayHello('kait'));
        console.log(sayHey('kait'));
        console.log('----------');

        function createGame(gameName) {
            let score = 0;

            return function win() {
                score++;
                return `Your name ${gameName} score is ${score}`;
            };
        }

        const hockeyGame = createGame('Hockey');
        const soccerGame = createGame('Soccer');
        console.log(hockeyGame());
        console.log(hockeyGame());
        console.log(hockeyGame());
        console.log(soccerGame());
        console.log(soccerGame());
        console.log('----------');

        function makeAdder(x) {
            return function (y) {
                return x + y;
            };
        }

        const add5 = makeAdder(5);
        const add10 = makeAdder(10);

        console.log(add5(2)); // 7
        console.log(add10(2)); // 12
    </script>

    <a href="https://wesbos.com/javascript/03-the-tricky-bits/closures">Fonte: wesbos - closures</a><br>
    <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures">Fonte: mdn - closures</a><br>
    <cite>A closure is the ability to access a parent level scope from a child scope, even after the parent function has
        been terminated.</cite>
</body>

</html>
